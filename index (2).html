<head>

<title>Alma Criolla | Mates</title>
<style>
:root{--bg:#f7f1e8;--paper:#fffdf9;--ink:#342218;--brown:#62432d;--gold:#b58a55;--muted:#806f60;--line:#e6d9ca;--green:#496747;--red:#a3463d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}a{text-decoration:none;color:inherit}.wrap{max-width:1180px;margin:auto;padding:0 22px}
header{position:sticky;top:0;z-index:20;background:#f7f1e8ee;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.nav{height:78px;display:flex;align-items:center;justify-content:space-between}.brand{font:700 28px Georgia,serif}.brand span{color:var(--brown)}nav{display:flex;gap:20px;font-size:14px}nav a:hover{color:var(--gold)}
.btn{border:0;border-radius:11px;background:var(--brown);color:white;padding:11px 15px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.btn.light{background:#eee3d5;color:var(--ink)}.btn.gold{background:var(--gold)}.btn.red{background:var(--red)}.btn.small{padding:8px 10px;font-size:11px}.menu-toggle{display:none}
.hero{padding:70px 0 55px;display:grid;grid-template-columns:1.1fr .9fr;gap:45px;align-items:center}.eyebrow{font-size:11px;letter-spacing:.2em;font-weight:900;color:var(--gold);text-transform:uppercase}.hero h1{font:700 clamp(45px,6vw,75px)/.98 Georgia,serif;margin:14px 0 20px}.hero p,.intro{color:var(--muted);line-height:1.75;font-size:17px}.hero-art{height:440px;border-radius:32px;background:linear-gradient(145deg,#765034,#2e1f16);display:flex;align-items:center;justify-content:center;font-size:140px;box-shadow:0 25px 55px #34221822}
.section{padding:42px 0 70px}.heading{display:flex;justify-content:space-between;align-items:end;margin-bottom:24px}.heading h2{font:700 39px Georgia,serif;margin:0}.heading p{color:var(--muted);margin:6px 0}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.cat{min-height:165px;background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px;display:flex;flex-direction:column;justify-content:end;transition:.2s}.cat:hover{transform:translateY(-4px);box-shadow:0 16px 35px #34221810}.cat small{font-weight:900;color:var(--gold);font-size:10px;letter-spacing:.15em}.cat strong{font:700 25px Georgia,serif;margin-top:8px}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;overflow:hidden}.photo{height:240px;background:linear-gradient(135deg,#eadcc9,#c9a980);position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:70px}.mate-shape{width:115px;height:145px;border-radius:46% 46% 38% 38%;background:linear-gradient(90deg,#4d301e,#8b5c3c,#4a2b1a);box-shadow:inset 15px 0 20px #21100655,8px 12px 20px #34221833;position:relative}.mate-shape:after{content:"";position:absolute;top:-4px;left:24px;width:67px;height:12px;border-radius:50%;background:#b58a55}.badge{position:absolute;top:12px;left:12px;background:#fff7ed;color:var(--brown);padding:6px 9px;border-radius:99px;font-size:10px;font-weight:900}.body{padding:16px}.body h3{font:700 19px Georgia,serif;margin:0 0 7px}.body p{font-size:13px;color:var(--muted);line-height:1.45;min-height:38px;margin:0}.price{font-weight:900;font-size:21px;margin:13px 0}.old{text-decoration:line-through;color:#9d8d7c;font-size:13px;margin-left:6px}.stock{font-size:11px;font-weight:900;color:var(--green);margin-bottom:11px}.stock.off{color:var(--red)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.actions .btn{font-size:10px;padding:10px 5px}
.page{padding:45px 0 80px}.page h1{font:700 52px Georgia,serif;margin:0 0 12px}.crumb{color:var(--muted);font-size:13px;margin-bottom:22px}.product-detail{display:grid;grid-template-columns:1fr 1fr;gap:45px}.big-image{height:560px;border-radius:28px;background:#e7d8c6;overflow:hidden;display:flex;align-items:center;justify-content:center}.big-image img{width:100%;height:100%;object-fit:cover}.big-image .mate-shape{transform:scale(1.45)}.detail h1{font-size:52px}.detail p{color:var(--muted);line-height:1.8}.bigprice{font-size:34px;font-weight:900;margin:25px 0}.gallery{display:flex;gap:9px;margin-top:12px;overflow:auto}.thumb{width:72px;height:72px;border-radius:10px;object-fit:cover;border:1px solid var(--line)}
.about{background:#3d281b;color:#fff5e8;border-radius:28px;padding:55px;display:grid;grid-template-columns:1fr 1fr;gap:45px}.about h2{font:700 44px Georgia,serif;margin:10px 0 18px}.about p{color:#dbc8b3;line-height:1.8}.about-box{border:1px solid #ffffff28;background:#ffffff08;border-radius:18px;padding:26px}.about-box strong{font:700 25px Georgia,serif;display:block;margin-bottom:10px}.about-box span{color:#dbc8b3;line-height:1.6}
.admin{padding:40px 0 80px}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:20px}.admin-grid{display:grid;grid-template-columns:390px 1fr;gap:20px}.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px}.field{margin-bottom:13px}.field label{display:block;font-size:11px;font-weight:900;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:white;font:inherit}.field textarea{min-height:82px;resize:vertical}.check{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800}.upload{border:2px dashed #d6c6b5;border-radius:14px;padding:18px;text-align:center;background:#fbf7f0}.upload input{display:block;width:100%;margin-top:10px}.previews{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.preview{position:relative}.preview img{width:100%;height:85px;object-fit:cover;border-radius:8px}.x{position:absolute;right:3px;top:3px;border:0;background:#a3463d;color:#fff;border-radius:50%;width:21px;height:21px;cursor:pointer}.admin-list{display:grid;gap:9px}.admin-row{border:1px solid var(--line);border-radius:13px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.admin-row-main{display:flex;align-items:center;gap:12px}.admin-thumb{width:55px;height:55px;border-radius:9px;object-fit:cover;background:#e5d6c3}.admin-row small{display:block;color:var(--muted);margin-top:4px}.modal-back{position:fixed;inset:0;background:#0007;z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}.modal{max-width:500px;width:100%;background:var(--paper);border-radius:20px;padding:25px}.modal h2{font:700 30px Georgia,serif;margin-top:0}.notice{background:#f0e4d5;border-radius:11px;padding:12px;font-size:12px;color:var(--brown);margin-bottom:15px}
footer{border-top:1px solid var(--line);padding:35px 0;color:var(--muted);font-size:13px}
.cart-float{position:fixed;right:18px;bottom:18px;z-index:35;border:0;border-radius:999px;background:var(--brown);color:white;padding:13px 17px;box-shadow:0 12px 28px #34221833;font-weight:900;cursor:pointer;display:flex;align-items:center;gap:8px}.cart-count{min-width:22px;height:22px;padding:0 6px;border-radius:99px;background:var(--gold);display:inline-flex;align-items:center;justify-content:center;font-size:11px}.cart-empty{padding:22px;text-align:center;color:var(--muted);background:#fbf7f0;border-radius:14px}.cart-item{display:grid;grid-template-columns:58px 1fr auto;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0}.cart-item:last-child{border-bottom:0}.cart-item img{width:58px;height:58px;border-radius:9px;object-fit:cover;background:#eadcc9}.cart-item-name{font-weight:900;font-size:14px}.cart-item-price{color:var(--muted);font-size:12px;margin-top:4px}.qty{display:flex;align-items:center;gap:6px}.qty button{border:1px solid var(--line);background:white;border-radius:8px;width:30px;height:30px;cursor:pointer;font-weight:900}.qty span{min-width:18px;text-align:center;font-weight:900}.cart-total{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:15px;margin-top:10px;font-weight:900;font-size:18px}.cart-note{font-size:12px;color:var(--muted);line-height:1.5;margin:10px 0 15px}.cart-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:15px}
@media(max-width:550px){.cart-float{right:12px;bottom:12px;padding:12px 14px}.cart-actions{grid-template-columns:1fr}.cart-item{grid-template-columns:50px 1fr}.cart-item>div:last-child{grid-column:2}.cart-item img{width:50px;height:50px}}
@media(max-width:900px){.wrap{padding:0 18px}.nav{height:68px}.menu-toggle{display:block;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:20px;cursor:pointer}.nav nav{display:none;position:absolute;top:68px;left:0;right:0;background:var(--paper);border-bottom:1px solid var(--line);box-shadow:0 12px 25px #34221818;padding:12px 18px;flex-direction:column;gap:0}.nav nav.open{display:flex}.nav nav a{padding:13px 4px;border-bottom:1px solid var(--line)}.nav nav a:last-child{border-bottom:0}.hero,.product-detail,.about,.admin-grid{grid-template-columns:1fr}.cats{grid-template-columns:repeat(2,1fr)}.products{grid-template-columns:repeat(2,1fr)}.admin-top{align-items:stretch;flex-direction:column}.admin-top>div:last-child{width:100%;flex-wrap:wrap}.admin-top .btn{flex:1}.admin-row{align-items:flex-start;flex-direction:column}.admin-row>div:last-child{width:100%;display:grid!important;grid-template-columns:1fr 1fr}.admin-row>div:last-child .btn{width:100%}.modal-back{align-items:flex-start;overflow-y:auto;padding:10px}.modal{max-height:calc(100vh - 20px);overflow-y:auto;padding:20px}.modal .btn{width:100%;margin-bottom:7px}.previews{grid-template-columns:repeat(2,1fr)}}
@media(max-width:550px){.wrap{padding:0 14px}.brand{font-size:24px}.hero{padding:42px 0 35px;gap:25px}.hero h1,.page h1,.detail h1{font-size:38px}.hero p,.intro{font-size:15px}.hero-art{height:240px;font-size:105px}.cats,.products{grid-template-columns:1fr}.section{padding:30px 0 50px}.heading{display:block}.heading h2{font-size:32px}.photo{height:260px}.big-image{height:340px}.about{padding:28px 22px;gap:25px}.about h2{font-size:36px}.page{padding:30px 0 55px}.detail p{font-size:15px}.bigprice{font-size:30px}.actions{grid-template-columns:1fr}.actions .btn{font-size:12px}.admin{padding:25px 0 55px}.admin h1{font-size:34px}.panel{padding:17px}.admin-top .btn{font-size:11px;padding:10px 8px}.admin-row-main{width:100%;align-items:flex-start}.admin-row-main>div:last-child{min-width:0}.admin-row b{display:block;overflow-wrap:anywhere}.admin-row small{font-size:11px}.modal h2{font-size:26px}.field input,.field textarea,.field select{font-size:16px}footer{padding:28px 0;line-height:1.6}}

function loadLocal(){try{const x=JSON.parse(localStorage.getItem(KEY));return Array.isArray(x)?x:structuredClone(SEED)}catch(e){return structuredClone(SEED)}}
function normalizeFeatured(list){const any=list.some(p=>typeof p.featured==="boolean");return list.map((p,i)=>({...p,featured:any?!!p.featured:i<8}))}
function saveLocal(x){localStorage.setItem(KEY,JSON.stringify(x))}
let PRODUCTS=normalizeFeatured(loadLocal());
let remoteReady=false;
async function saveRemote(){
  const {error}=await sbClient.from("catalog").upsert({id:CATALOG_ROW_ID,products:PRODUCTS,updated_at:new Date().toISOString()});
  if(error)throw error;
  remoteReady=true;
  saveLocal(PRODUCTS);
}
async function initRemote(){
  try{
    const {data,error}=await sbClient.from("catalog").select("products").eq("id",CATALOG_ROW_ID).maybeSingle();
    if(error)throw error;
    if(data&&Array.isArray(data.products)){
      PRODUCTS=normalizeFeatured(data.products);saveLocal(PRODUCTS);remoteReady=true;render();
    }else{
      await saveRemote();
    }
  }catch(e){
    console.error("Supabase:",e);
    remoteReady=false;
    const msg=e?.message||"No se pudo conectar con Supabase.";
    console.warn("Catálogo online no disponible:",msg);
  }
}

<section class="section"><div class="heading"><div><h2>Elegí tu categoría</h2><p>Cada categoría tiene su propia página y catálogo.</p></div></div><div class="cats"><a class="cat" href="#/mates/imperiales"><small>MATES</small><strong>Imperiales</strong></a><a class="cat" href="#/mates/torpedos"><small>MATES</small><strong>Torpedos</strong></a><a class="cat" href="#/mates/otros"><small>MATES</small><strong>Otros Mates</strong></a><a class="cat" href="#/bombillas"><small>COMPLEMENTOS</small><strong>Bombillas</strong></a><a class="cat" href="#/termos"><small>COMPLEMENTOS</small><strong>Termos</strong></a><a class="cat" href="#/accesorios"><small>COMPLEMENTOS</small><strong>Accesorios</strong></a><a class="cat" href="#/combos"><small>OFERTAS</small><strong>Combos y ofertas</strong></a></div></section>

<section class="section"><div class="about"><div><div class="eyebrow">NUESTRA HISTORIA</div><h2>Quiénes somos</h2><p>Somos un emprendimiento de mates de Córdoba Capital que busca acercar productos materos con identidad, calidad y una atención cercana.</p><p>Detrás de Alma Criolla hay dos jóvenes emprendedores con ganas de crecer, ofrecer buenos productos y construir una marca propia alrededor de nuestra cultura matera.</p></div><div class="about-box"><strong>Alma Criolla</strong><span>Creemos que el mate es mucho más que un producto: es una costumbre, un encuentro y una parte de nuestra identidad.</span></div></div></section></div>`}
function mates(){return `<div class="wrap page"><div class="crumb"><a href="#/">Inicio</a> / Mates</div><h1>Mates</h1><p class="intro">Elegí entre nuestros diferentes estilos de mates.</p><div class="cats"><a class="cat" href="#/mates/imperiales"><small>MATES</small><strong>Imperiales</strong></a><a class="cat" href="#/mates/torpedos"><small>MATES</small><strong>Torpedos</strong></a><a class="cat" href="#/mates/otros"><small>MATES</small><strong>Otros Mates</strong></a></div></div>`}
function category(cat){let arr=PRODUCTS.filter(p=>p.cat===cat);return `<div class="wrap page"><div class="crumb"><a href="#/">Inicio</a> / ${CATS[cat]}</div><h1>${CATS[cat]}</h1><p class="intro">Descubrí nuestra selección de ${CATS[cat].toLowerCase()}. Todos los productos se administran desde <a href="#/admin"><b>/admin</b></a>.</p>${grid(arr)}</div>`}
function product(sl){let p=PRODUCTS.find(x=>x.slug===sl);if(!p)return notfound();let rel=PRODUCTS.filter(x=>x.cat===p.cat&&x.id!==p.id).slice(0,4);return `<div class="wrap page"><div class="crumb"><a href="#/">Inicio</a> / ${CATS[p.cat]} / ${p.name}</div><div class="product-detail"><div>${photo(p,true)}${p.images?.length>1?`<div class="gallery">${p.images.map(x=>`<img class="thumb" src="${x}">`).join("")}</div>`:""}</div><div class="detail"><div class="eyebrow">ALMA CRIOLLA</div><h1>${p.name}</h1><p>${p.description||p.short||""}</p><div class="bigprice">${money(p.price)}${p.oldPrice?` <span class="old">${money(p.oldPrice)}</span>`:""}</div><div class="stock ${p.stock?"":"off"}">${p.stock?"● DISPONIBLE":"● SIN STOCK"}</div><button class="btn" ${p.stock?`onclick="addToCart('${p.id}')"`:`disabled`}>${p.stock?"🛒 AGREGAR AL CARRITO":"SIN STOCK"}</button></div></div><section class="section"><div class="heading"><div><h2>Productos relacionados</h2><p>Otros productos de la misma categoría.</p></div></div>${grid(rel)}</section></div>`}
function about(){return `<div class="wrap page"><div class="about"><div><div class="eyebrow">ALMA CRIOLLA</div><h2>Quiénes somos</h2><p>Somos un emprendimiento de mates de Córdoba Capital que busca ofrecer productos con identidad criolla, buena presentación y una atención cercana.</p><p>Somos dos jóvenes emprendedores con ganas de crecer y construir una marca que represente nuestra pasión por el mate y por lo nuestro.</p></div><div class="about-box"><strong>Hecho para compartir</strong><span>El mate es una costumbre, un encuentro y una parte de nuestra identidad. Queremos que comprar en Alma Criolla sea simple y cercano.</span></div></div></div>`}
function admin(){if(!adminLogged())return `<div class="wrap admin"><div class="panel" style="max-width:460px;margin:50px auto"><div class="eyebrow">ACCESO PRIVADO</div><h1>Panel de administración</h1><p class="intro">Ingresá únicamente la contraseña para administrar el catálogo.</p><div class="field"><label>CONTRASEÑA</label><input id="admin_password" type="password" placeholder="Ingresá tu contraseña" onkeydown="if(event.key==='Enter')loginAdmin()"></div><button class="btn" onclick="loginAdmin()">INGRESAR</button><div id="admin_error" style="color:var(--red);font-size:12px;margin-top:10px"></div></div></div>`;return `<div class="wrap admin"><div class="admin-top"><div><div class="eyebrow">CATÁLOGO</div><h1>Panel de administración</h1><p class="intro">Agregá productos, subí fotos, cambiá precios, stock, categorías y etiquetas sin tocar el código. Los cambios se publican online.</p></div><div style="display:flex;gap:8px"><button class="btn light" onclick="logoutAdmin()">CERRAR SESIÓN</button><button class="btn gold" onclick="openEditor()">+ AGREGAR PRODUCTO</button></div></div><div class="admin-grid"><div class="panel"><h2>Cómo funciona</h2><div class="notice"><b>Fotos:</b> podés seleccionar varias imágenes desde tu PC o celular. Se suben a Supabase y quedan disponibles para todos los visitantes.</div><div class="notice"><b>Precios:</b> cambiá el precio y guardá. Se publica para todos los visitantes.</div><div class="notice"><b>Categoría:</b> si movés un producto, aparece automáticamente en la nueva categoría.</div><div class="notice"><b>Stock:</b> al marcar SIN STOCK se desactiva el botón de consulta por Instagram.</div><div class="notice"><b>Destacados:</b> al editar un producto, marcá <b>MOSTRAR EN DESTACADOS</b> para decidir qué productos aparecen en la portada.</div><div class="notice"><b>Instagram:</b> editá la constante <b>INSTAGRAM_URL</b> del archivo para poner el perfil exacto de Alma Criolla.</div><button class="btn" onclick="openEditor()">+ NUEVO PRODUCTO</button></div><div class="panel"><h2>Productos (${PRODUCTS.length})</h2><div class="admin-list">${PRODUCTS.map(p=>`<div class="admin-row"><div class="admin-row-main">${p.images?.[0]?`<img class="admin-thumb" src="${p.images[0]}">`:`<div class="admin-thumb"></div>`}<div><b>${p.name}</b><small>${CATS[p.cat]} · ${money(p.price)} · ${p.stock?"Disponible":"Sin stock"}${p.featured?" · ⭐ Destacado":""}</small></div></div><div style="display:flex;gap:6px"><button class="btn light small" onclick="openEditor('${p.id}')">EDITAR</button><button class="btn red small" onclick="removeProduct('${p.id}')">ELIMINAR</button></div></div>`).join("")}</div></div></div></div>`}
function loginAdmin(){let input=document.getElementById("admin_password"),error=document.getElementById("admin_error");if(input?.value===ADMIN_PASSWORD){sessionStorage.setItem("alma_admin_ok","1");render()}else if(error){error.textContent="Contraseña incorrecta.";input.value="";input.focus()}}
function logoutAdmin(){sessionStorage.removeItem("alma_admin_ok");render()}
function openEditor(id=""){let p=PRODUCTS.find(x=>x.id===id)||{id:"",name:"",cat:"imperiales",price:"",oldPrice:"",short:"",description:"",stock:true,badge:"",featured:false,images:[]};window.editImages=[...(p.images||[])];window.editFiles=[];const opts=Object.entries(CATS).map(([v,t])=>`<option value="${v}" ${p.cat===v?"selected":""}>${t}</option>`).join("");document.body.insertAdjacentHTML("beforeend",`<div class="modal-back" id="modal"><div class="modal"><h2>${id?"Editar producto":"Agregar producto"}</h2><div class="field"><label>NOMBRE</label><input id="f_name" value="${esc(p.name)}"></div><div class="field"><label>CATEGORÍA</label><select id="f_cat">${opts}</select></div><div class="field"><label>PRECIO ACTUAL</label><input id="f_price" type="number" value="${p.price}"></div><div class="field"><label>PRECIO ANTERIOR (opcional)</label><input id="f_old" type="number" value="${p.oldPrice||""}"></div><div class="field"><label>DESCRIPCIÓN CORTA</label><textarea id="f_short">${esc(p.short||"")}</textarea></div><div class="field"><label>DESCRIPCIÓN COMPLETA</label><textarea id="f_desc">${esc(p.description||"")}</textarea></div><div class="field"><label>ETIQUETA</label><input id="f_badge" placeholder="OFERTA / NUEVO / COMBO" value="${esc(p.badge||"")}"></div><div class="field"><label class="check"><input id="f_featured" type="checkbox" ${p.featured?"checked":""}> MOSTRAR EN DESTACADOS</label></div><div class="field"><label class="check"><input id="f_stock" type="checkbox" ${p.stock?"checked":""}> PRODUCTO DISPONIBLE</label></div><div class="upload"><b>FOTOS DEL PRODUCTO</b><div style="font-size:12px;color:var(--muted);margin-top:5px">Podés seleccionar varias. La primera será la imagen principal. Se subirán a Internet al guardar.</div><input id="f_files" type="file" accept="image/*" multiple onchange="readImages(this)"><div class="previews" id="previews"></div></div><br><button class="btn" onclick="saveProduct('${id}')">GUARDAR PRODUCTO</button> <button class="btn light" onclick="closeModal()">CANCELAR</button></div></div>`);renderPreviews()}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function readImages(input){[...input.files].forEach(file=>{if(!file.type.startsWith("image/"))return;const preview=URL.createObjectURL(file);window.editFiles.push({file,preview});renderPreviews()})}
function renderPreviews(){let el=document.getElementById("previews");if(!el)return;const items=[...window.editImages.map((url,i)=>({src:url,kind:"url",index:i})),...(window.editFiles||[]).map((x,i)=>({src:x.preview,kind:"file",index:i}))];el.innerHTML=items.map((x,i)=>`<div class="preview"><img src="${x.src}" alt="Foto ${i+1}"><button class="x" onclick="removeEditImage('${x.kind}',${x.index})">×</button></div>`).join("")}
function removeEditImage(kind,index){if(kind==="url")window.editImages.splice(index,1);else{const f=window.editFiles.splice(index,1)[0];if(f?.preview)URL.revokeObjectURL(f.preview)}renderPreviews()}
async function uploadPendingImages(productId){const urls=[...(window.editImages||[])];for(let i=0;i<(window.editFiles||[]).length;i++){const item=window.editFiles[i],file=item.file;const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";const path=`${productId}/${Date.now()}-${Math.random().toString(36).slice(2,10)}.${ext}`;const {error}=await sbClient.storage.from(STORAGE_BUCKET).upload(path,file,{upsert:false,contentType:file.type||"image/jpeg"});if(error)throw error;const {data}=sbClient.storage.from(STORAGE_BUCKET).getPublicUrl(path);urls.push(data.publicUrl)}return urls}
async function saveProduct(id){let name=document.getElementById("f_name").value.trim();if(!name){alert("Poné un nombre para el producto.");return}const btn=document.querySelector('#modal .btn:not(.light)');if(btn){btn.disabled=true;btn.textContent="GUARDANDO..."}try{let existing=PRODUCTS.find(x=>x.id===id);let productId=id||("p-"+Date.now());let images=await uploadPendingImages(productId);let obj={id:productId,slug:existing?.slug||slug(name)+"-"+Date.now().toString().slice(-5),name,cat:document.getElementById("f_cat").value,price:Number(document.getElementById("f_price").value)||0,oldPrice:Number(document.getElementById("f_old").value)||"",short:document.getElementById("f_short").value,description:document.getElementById("f_desc").value,stock:document.getElementById("f_stock").checked,badge:document.getElementById("f_badge").value,featured:document.getElementById("f_featured").checked,images};let i=PRODUCTS.findIndex(x=>x.id===id);if(i>=0)PRODUCTS[i]=obj;else PRODUCTS.push(obj);await saveRemote();closeModal();render()}catch(e){console.error(e);alert("No se pudo guardar online. Revisá que la tabla catalog y las políticas de Supabase estén creadas correctamente.\n\n"+(e?.message||e))}finally{if(btn){btn.disabled=false;btn.textContent="GUARDAR PRODUCTO"}}}
async function removeProduct(id){let p=PRODUCTS.find(x=>x.id===id);if(!p)return;if(confirm("¿Eliminar "+p.name+"?")){PRODUCTS=PRODUCTS.filter(x=>x.id!==id);try{await saveRemote();render()}catch(e){console.error(e);alert("No se pudo eliminar online. El cambio no fue publicado.")}}}
function closeModal(){(window.editFiles||[]).forEach(x=>x.preview&&URL.revokeObjectURL(x.preview));document.getElementById("modal")?.remove();window.editImages=[];window.editFiles=[]}
function notfound(){return `<div class="wrap page"><h1>Página no encontrada</h1><a class="btn" href="#/">Volver al inicio</a></div>`}
function render(){let h=location.hash.slice(1)||"/",a=document.getElementById("app");if(h==="/")a.innerHTML=home();else if(h==="/mates")a.innerHTML=mates();else if(h==="/quienes-somos")a.innerHTML=about();else if(h==="/admin")a.innerHTML=admin();else if(h.startsWith("/producto/"))a.innerHTML=product(h.split("/")[2]);else if(h.startsWith("/mates/"))a.innerHTML=category(h.split("/")[2]);else if(h==="/combos")a.innerHTML=category("combos");else if(CATS[h.slice(1)])a.innerHTML=category(h.slice(1));else a.innerHTML=notfound()}
window.addEventListener("hashchange",render);
window.addEventListener("storage",()=>{CART=loadCart();updateCartCount()});
document.addEventListener("DOMContentLoaded",()=>updateCartCount());
document.body.insertAdjacentHTML("beforeend",`<button class="cart-float" onclick="openCart()" aria-label="Abrir carrito">🛒 Carrito <span class="cart-count" id="float-cart-count">0</span></button>`);
updateCartCount();
render();
initRemote();
</script>
